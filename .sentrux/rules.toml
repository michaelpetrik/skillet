# Staged Sentrux rules.
#
# These limits now reflect the tested TypeScript CLI boundaries introduced in
# R3-R10. They are still intentionally staged: keep the remaining temporary
# allowances visible until a reviewed structural baseline is saved in R12.

[constraints]
# Quality currently reports 0.63. Keep a little headroom for normal edits while
# making an accidental broad structural regression fail locally.
min_quality = 0.6

# Score subdimensions remain observational until R12 records a reviewed
# baseline with the full Sentrux metric set.
min_modularity = 0
min_acyclicity = 0
min_depth = 0
min_equality = 0
min_redundancy = 0

# Enforce the current no-cycle boundary and tighter size/complexity ceilings.
max_cycles = 0
max_cc = 50
max_fn_lines = 240
max_file_lines = 1500

# Coupling, upward violations, and god-file detection need reviewed baseline
# data before promotion. Two packaged skill template scripts are still over
# 1000 lines and are tracked as a temporary staged allowance here.
max_coupling_score = 1.0
max_upward_violations = 999
no_god_files = false
